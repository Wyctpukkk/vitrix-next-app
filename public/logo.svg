<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <mask id="cutout">
      <!-- Белый фон маски (всё, что белое — остается видимым) -->
      <rect x="0" y="0" width="240" height="200" fill="#FFFFFF"/>
      
      <!-- Черные линии (всё, что черное — вырезается, становится прозрачным) -->
      <!-- Линия слева сверху -->
      <line x1="82" y1="160" x2="144" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="butt"/>
      
      <!-- Линия справа снизу -->
      <line x1="108" y1="160" x2="170" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="butt"/>
    </mask>
  </defs>

  <!-- Группа с буквами, к которой применяется маска -->
  <g mask="url(#cutout)">
    <!-- 1. ЛЕВАЯ ПАЛКА V -->
    <polygon points="20,20 46,20 108,160 82,160" fill="#34c759"/>

    <!-- 2. ПРАВАЯ ПАЛКА V (ОНА ЖЕ ПЕРВАЯ ПАЛКА X) -->
    <polygon points="82,160 108,160 170,20 144,20" fill="#34c759"/>

    <!-- 3. ВТОРАЯ ПАЛКА X -->
    <polygon points="82,20 108,20 170,160 144,160" fill="#34c759"/>
  </g>
</svg>